    <style>
      /* Splash de arranque: se pinta antes de que cargue el JS */
      html, body { background: #0b1a10; margin: 0; }
      #boot {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 42%, #173a22 0%, #0b1a10 62%);
        transition: opacity .45s ease, visibility .45s;
      }
      #boot.hide { opacity: 0; visibility: hidden; }
      #boot .wrap { position: relative; display: grid; place-items: center; gap: 22px; transform: translateY(-4vh); }
      #boot .ring {
        position: absolute; top: 0; width: 168px; height: 168px; border-radius: 50%;
        border: 3px solid #31a943; animation: boot-ring 1.6s ease-out infinite; opacity: 0;
      }
      #boot img {
        width: 168px; height: 168px; border-radius: 50%; display: block;
        box-shadow: 0 12px 40px rgba(0,0,0,.45);
        animation: boot-in .7s cubic-bezier(.2,1.4,.4,1) both;
      }
      #boot .t {
        font: 800 15px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        letter-spacing: .32em; text-transform: uppercase; color: #cfe9d4;
        animation: boot-fade .6s .35s both;
      }
      @keyframes boot-in { from { transform: scale(.4) rotate(-120deg); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes boot-ring { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.7); opacity: 0; } }
      @keyframes boot-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #boot *, #boot { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="wrap">
        <span class="ring"></span>
        <img src="/logo-256.webp" alt="" width="168" height="168" />
        <span class="t">Ancares</span>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
